# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net
name: .NET

on:
  push:
    branches:
      - master
      - release/*
      - hotfix/*
      - dev
      - feature/*
  pull_request:
    branches:
      - master
  workflow_dispatch: # allows manual runs from the Actions tab

jobs:
  build:
    permissions: # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#defining-access-for-the-github_token-scopes
      contents: write

    env:
      BUILD_CONFIG: 'Release'
      SOLUTION: 'Cross.PepperVault.slnx'

    runs-on: ubuntu-22.04 # ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Disabling shallow clones is recommended for improving the relevancy of reporting

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x
            10.0.x

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2.0.0

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v1.1.1
        with:
          versionSpec: 5.12.0

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v1.1.1
        with:
          useConfigFile: true

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: |
          dotnet build "$SOLUTION" --configuration "$BUILD_CONFIG" --no-restore \
            -p:Configuration=$BUILD_CONFIG \
            -p:Version=${GitVersion_SemVer} \
            -p:AssemblyVersion=${GitVersion_AssemblySemVer} \
            -p:FileVersion=${GitVersion_AssemblySemFileVer} \
            -p:InformationalVersion="${GitVersion_InformationalVersion}" \
            -p:Company="Denis Peshkov" \
            -p:Product="Cross.PepperVault" \
            -p:Description="Cross.PepperVault: configurable pepper loading for .NET. Published on NuGet: https://www.nuget.org/packages/Cross.PepperVault" \
            -p:RepositoryUrl="https://github.com/denis-peshkov/Cross.PepperVault.git" \
            -p:RepositoryType=git \
            -p:CLSCompliant=true \
            -p:NeutralLanguage=en

      - name: Run tests
        run: >
          dotnet test "$SOLUTION"
          -c "$BUILD_CONFIG"
          --no-restore
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: SonarQube Scan
        uses: sonarsource/sonarcloud-github-action@v5 # Ex: v4.0.0, See the latest version at https://github.com/marketplace/actions/sonarcloud-scan
        with:
          args: >
            -Dsonar.organization=peshkov
            -Dsonar.projectKey=Cross.PepperVault
            -Dsonar.cs.opencover.reportsPaths=TestResults/**/coverage.opencover.xml
            -Dsonar.sources=Cross.PepperVault
            -Dsonar.tests=Cross.PepperVault.Tests
            -Dsonar.verbose=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: NuGet Pack (all packages)
        run: |
          set -euo pipefail
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts/nuget"
          for p in \
            Cross.PepperVault \
            Cross.PepperVault.Env \
            Cross.PepperVault.EnvJson \
            Cross.PepperVault.FileJson \
            Cross.PepperVault.AzureKvJson \
            Cross.PepperVault.AzureKvVersioned \
            Cross.PepperVault.AwsSecretsJson \
            Cross.PepperVault.GcpSecretManagerJson \
            Cross.PepperVault.HcvKv2Json
          do
            (cd "$p" && nuget pack config.nuspec -Version "$VERSION" -OutputDirectory "${GITHUB_WORKSPACE}/artifacts/nuget" -NoDefaultExcludes)
          done
          ls -la "${GITHUB_WORKSPACE}/artifacts/nuget"

      - name: Create git Tag
        if: ${{ contains('refs/heads/master', github.ref) || contains('refs/heads/release', github.ref) || contains('refs/heads/hotfix', github.ref) }}
        run: |
          git tag v${{ env.semVer }}

      - name: Push git Tag
        if: ${{ contains(fromJson('["refs/heads/master", "refs/heads/release", "refs/heads/hotfix"]'), github.ref) }}
        run: |
          git config --global user.name 'Denis Peshkov'
          git config --global user.email 'denis.peshkov@outlook.com'
          git remote set-url origin https://x-access-token:${{ secrets.TAGTOKEN }}@github.com/${{ github.repository }}
          git push origin v${{ env.semVer }}

      - name: Nuget Push
        if: ${{ !startsWith(github.ref, 'refs/pull') }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in "${GITHUB_WORKSPACE}"/artifacts/nuget/*.nupkg; do
            dotnet nuget push "$f" --source "https://api.nuget.org/v3/index.json" --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate
          done
